name: lerobot-assistant
version: 1.1.0
description: LeRobot assistant configuration for diagnostics, references, and robot templates.

lerobot:
  stable_version: "0.5.1"
  min_python_version: "3.12"
  recommended_python_version: "3.12"
  min_torch_version: "2.10.0"
  docs_version: "v0.5.1"

urls:
  github: "https://github.com/huggingface/lerobot"
  documentation: "https://huggingface.co/docs/lerobot/v0.5.1/en/index"
  documentation_main: "https://huggingface.co/docs/lerobot/main/en/index"
  hub: "https://huggingface.co/lerobot"
  discord: "https://discord.gg/s3KuuzsPFb"

install_profiles:
  stable_core:
    description: Stable PyPI install for recording, calibration, and training workflows.
    command: "pip install \"lerobot[all]==0.5.1\""
  source_core:
    description: Editable source install for development and latest main docs.
    commands:
      - "git clone https://github.com/huggingface/lerobot.git"
      - "cd lerobot"
      - "pip install -e \".[all]\""
  so101:
    description: SO-101/S101 hardware support.
    command: "pip install \"lerobot[feetech]\""
  koch:
    description: Koch v1.1 hardware support.
    command: "pip install \"lerobot[dynamixel]\""
  simulation:
    description: Aloha and PushT simulation support.
    command: "pip install \"lerobot[aloha,pusht]\""

robots:
  so101:
    aliases: ["SO-101", "SO101", "S101"]
    robot_type: "so101_follower"
    teleop_type: "so101_leader"
    sdk: "feetech"
    template: "templates/so101_config.yaml"
  koch:
    aliases: ["Koch", "Koch v1.1"]
    robot_type: "koch_follower"
    teleop_type: "koch_leader"
    sdk: "dynamixel"
  aloha:
    aliases: ["Aloha"]
    robot_type: "aloha"
    sdk: "aloha"
  unitree_g1:
    aliases: ["Unitree", "Unitree G1"]
    robot_type: "unitree_g1"
    sdk: "unitree"

policies:
  act:
    name: "ACT"
    description: "Action Chunking with Transformers"
  smolvla:
    name: "SmolVLA"
    description: "Small Vision-Language-Action model"
  diffusion:
    name: "Diffusion"
    description: "Diffusion policy"
  pi:
    name: "Pi0/Pi0.5/Pi0-FAST"
    description: "Pi policy family"

environment_requirements:
  operating_systems:
    - "Linux"
    - "macOS"
    - "Windows via WSL2 for most hardware workflows"
  hardware:
    gpu_min_vram: "8GB for practical training"
    ram_min: "16GB"
    disk_min_free_space: "50GB"
  optional_tools:
    - "ffmpeg"
    - "huggingface-cli"
    - "nvidia-smi"
